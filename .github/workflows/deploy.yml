name: Verify and deploy

on:
  push:
    branches: [main]

concurrency:
  group: devjonny-blog-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  deploy:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install rsync
        run: sudo apt-get update && sudo apt-get install -y rsync

      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.BLOG_DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.BLOG_DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/blog_deploy_key
          chmod 600 ~/.ssh/blog_deploy_key
          ssh-keyscan -H "${DEPLOY_HOST#*@}" >> ~/.ssh/known_hosts

      - name: Create application directory
        env:
          DEPLOY_HOST: ${{ secrets.BLOG_DEPLOY_HOST }}
        run: |
          ssh -i ~/.ssh/blog_deploy_key -o IdentitiesOnly=yes "$DEPLOY_HOST" \
            "mkdir -p /home/ubuntu/dev/devjonny-blog"

      - name: Sync application source
        env:
          DEPLOY_HOST: ${{ secrets.BLOG_DEPLOY_HOST }}
        run: |
          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.next/' \
            --exclude 'node_modules/' \
            --exclude '.env*' \
            -e 'ssh -i ~/.ssh/blog_deploy_key -o IdentitiesOnly=yes' \
            ./ "${DEPLOY_HOST}:/home/ubuntu/dev/devjonny-blog/"

      - name: Build and restart application
        env:
          DEPLOY_HOST: ${{ secrets.BLOG_DEPLOY_HOST }}
        run: |
          ssh -i ~/.ssh/blog_deploy_key -o IdentitiesOnly=yes "$DEPLOY_HOST" 'bash -s' <<'EOF'
          set -euo pipefail
          cd /home/ubuntu/dev/devjonny-blog
          npm ci
          npm run build
          sudo -n systemctl restart devjonny-blog.service
          for attempt in {1..15}; do
            if curl -fsS http://127.0.0.1:3582/ > /dev/null && curl -fsS http://127.0.0.1:3582/post > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1
          EOF
